    // ==========================================
    // 2. SISTEMA UNIFICADO DE REVELADO (POINTERS)
    // ==========================================
    function vincularBotonRevelado(btnId, frontImgId, backImgId) {
        const btn = document.getElementById(btnId);
        const frontImg = document.getElementById(frontImgId);
        const backImg = document.getElementById(backImgId);

        if (!btn || !frontImg || !backImg) return;

        const mostrarReverso = (e) => {
            e.preventDefault();
            // Limpiamos estilos inline de opacidad temporales para priorizar las clases de Tailwind
            frontImg.style.opacity = '';
            backImg.style.opacity = '';
            
            frontImg.classList.remove('opacity-100');
            frontImg.classList.add('opacity-0', 'scale-[1.02]');
            
            backImg.classList.remove('opacity-0');
            backImg.classList.add('opacity-100', 'scale-[1.12]');
            
            if (navigator.vibrate) navigator.vibrate(10);
        };

        const ocultarReverso = () => {
            frontImg.classList.remove('opacity-0', 'scale-[1.02]');
            frontImg.classList.add('opacity-100');
            
            backImg.classList.remove('opacity-100', 'scale-[1.12]');
            backImg.classList.add('opacity-0');
        };

        btn.addEventListener('pointerdown', mostrarReverso);
        btn.addEventListener('pointerup', ocultarReverso);
        btn.addEventListener('pointerleave', ocultarReverso);
        
        btn.addEventListener('touchstart', mostrarReverso, { passive: false });
        btn.addEventListener('touchend', ocultarReverso);
    }

    // ==========================================
    // 5. CONTROL DEL PANEL LATERAL (DRAWER)
    // ==========================================
    function toggleSugarDrawer(open) {
        const sugarDrawer = document.getElementById('sugar-drawer');
        const mainVault = document.getElementById('main-vault');
        const bioBg = document.getElementById('page-bg-overlay');
        const sugarBg = document.getElementById('sugar-bg-overlay');

        if (!sugarDrawer || !mainVault) return;

        if (open) {
            sugarDrawer.classList.remove('translate-x-full', 'opacity-0', 'pointer-events-none');
            sugarDrawer.classList.add('translate-x-0', 'opacity-100');
            mainVault.classList.add('opacity-0', 'pointer-events-none');
            if (bioBg) bioBg.classList.add('opacity-0');
            if (sugarBg) {
                sugarBg.classList.remove('opacity-0', 'pointer-events-none');
                sugarBg.classList.add('opacity-100');
            }
        } else {
            sugarDrawer.classList.remove('translate-x-0', 'opacity-100');
            sugarDrawer.classList.add('translate-x-full', 'opacity-0', 'pointer-events-none');
            mainVault.classList.remove('opacity-0', 'pointer-events-none');
            if (sugarBg) {
                sugarBg.classList.remove('opacity-100');
                sugarBg.classList.add('opacity-0', 'pointer-events-none');
            }
            if (bioBg) bioBg.classList.remove('opacity-0');
        }
        if (navigator.vibrate) navigator.vibrate(15);
    }
