<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link class="icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIORUSH.WORLD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 'jako-black': '#0a0705' },
                    fontFamily: { 
                        'sans': ['Orbitron', 'sans-serif'],
                        'mono': ['Orbitron', 'monospace'],

    <style>
        body { 
            font-family: 'Orbitron', sans-serif; 
            scroll-behavior: smooth; 
            letter-spacing: 0.05em; 
            background-color: #0a0705;
        } 

        #page-bg-overlay, #sugar-bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #page-bg-overlay {
            background: radial-gradient(circle at 50% 50%, #035d3f 0%, #272625 100%);
        }

        #sugar-bg-overlay {
            background: radial-gradient(circle at 50% 50%, #4a0e4e 0%, #0f0212 100%);
        }

        .img-glow-transition {
            transition: filter 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: filter, transform;
        }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased selection:bg-white selection:text-black overflow-x-hidden bg-jako-black text-white">

                        <div class="absolute inset-0 flex items-center justify-center p-[2%] sm:p-[4%] z-10">
                            <svg id="sugar-vector-target" viewBox="0 0 400 400" class="w-full h-full fill-none stroke-pink-500/40 stroke-[1.5] transition-all duration-500 group-hover:stroke-pink-400/70">

                    <span id="sugar-choco" onclick="seleccionarVarianteSugar('CHOCO')" class="cursor-pointer transition-all duration-300 px-2.5 py-1.5 bg-[#1a0c1e]/80 backdrop-blur-md rounded-sm text-white border border-pink-500/50 shadow-[0_0_12px_rgba(236,72,153,0.15)]">CHOCO</span>

                <div class="justify-self-start flex items-center space-x-2 sm:space-x-3 text-left">

                <div class="justify-self-center text-center tracking-[0.25em] font-bold drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] text-white/50">

                        <img src="img/pace.png" class="w-5 h-5 object-contain opacity-60 group-hover:opacity-100 group-hover:scale-[1.05] transition-all duration-300 filter drop-shadow-[0_2px_4px_rgba(0,0,0,0.5)]" alt="Link Nodes">

<script>
    // ==========================================
    // LOGICA GLOBAL & LOGICA BIORUSH
    // ==========================================
    window.currentVariant = "FOCUS";

    const VARIANT_CONFIG = {
        'FOCUS': { title: 'BIORUSH MENTAL FOCUS', wa: 'BIORUSH MENTAL FOCUS 🧠' },
        'ZEN': { title: 'BIORUSH MENTAL ZEN', wa: 'BIORUSH MENTAL ZEN 🌌' },
        'STAMINA': { title: 'BIORUSH BODY STAMINA', wa: 'BIORUSH BODY STAMINA ⚡' },
        'CORE': { title: 'BIORUSH BODY CORE', wa: 'BIORUSH BODY CORE 🧬' }
    };

    function seleccionarVariante(variante) {
        window.currentVariant = variante;
        const config = VARIANT_CONFIG[variante];

        const titleEl = document.getElementById('laser-variant-title');
        if (titleEl && config) {
            titleEl.textContent = config.title;
        }

        const activeClass = "cursor-pointer transition-all duration-300 px-3.5 py-1.5 bg-[#141414]/80 backdrop-blur-md rounded-sm text-white border border-white/40 shadow-[0_0_12px_rgba(255,255,255,0.1)]";
        const inactiveClass = "cursor-pointer transition-all duration-300 px-3.5 py-1.5 bg-black/40 backdrop-blur-md rounded-sm text-white/40 border border-white/5 hover:border-white/30 hover:text-white/80";

        ['focus', 'zen', 'stamina', 'core'].forEach(opt => {
            const el = document.getElementById(`opt-${opt}`);
            if (el) {
                el.className = (opt === variante.toLowerCase()) ? activeClass : inactiveClass;
            }
        });

        if (navigator.vibrate) navigator.vibrate(8);
    }

    function adquirirNodo(producto) {
        const varianteActiva = window.currentVariant || "FOCUS";
        const productoSeleccionado = VARIANT_CONFIG[varianteActiva]?.wa || `${producto} ${varianteActiva}`;
        
        const numeroCelular = "573243770474"; 
        const mensaje = `⚡ *NUEVA ORDEN - BIORUSH* ⚡\n\n` +
                        `• *Producto:* ${productoSeleccionado}\n` +
                        `Solicito la inicialización y el despacho de este producto.`;

        const urlWhatsapp = `https://api.whatsapp.com/send?phone=${numeroCelular}&text=${encodeURIComponent(mensaje)}`;
        
        if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
        window.open(urlWhatsapp, '_blank');
    }

    // ==========================================
    // LÓGICA DE CONTROL DE LA LÍNEA SUGARRUSH
    // ==========================================
    window.currentSugarVariant = "CHOCO";

    const SUGAR_CONFIG = {
        'CHOCO': { title: 'SUGARRUSH CHOCO GLOW', wa: 'SUGARRUSH CHOCO GLOW 🍫' },
        'VANILLA': { title: 'SUGARRUSH VANILLA SKY', wa: 'SUGARRUSH VANILLA SKY 🍦' },
        'BERRY': { title: 'SUGARRUSH SWEET BERRY', wa: 'SUGARRUSH SWEET BERRY 🍓' },
        'CARAMEL': { title: 'SUGARRUSH GOLD CARAMEL', wa: 'SUGARRUSH GOLD CARAMEL 🍯' }
    };

    function toggleSugarDrawer(open) {
        const sugarDrawer = document.getElementById('sugar-drawer');
        const mainVault = document.getElementById('main-vault');
        const bioBg = document.getElementById('page-bg-overlay');
        const sugarBg = document.getElementById('sugar-bg-overlay');

        if (open) {
            // Animación hacia adentro del panel Sugar
            sugarDrawer.classList.remove('translate-x-full', 'opacity-0', 'pointer-events-none');
            sugarDrawer.classList.add('translate-x-0', 'opacity-100');
            // Ocultar suavemente el Main Vault
            mainVault.classList.add('opacity-0', 'pointer-events-none');
            // Intercambio de Backgrounds
            bioBg.classList.add('opacity-0');
            sugarBg.classList.remove('opacity-0');
            sugarBg.classList.add('opacity-100');
        } else {
            // Sacar panel de la pantalla
            sugarDrawer.classList.remove('translate-x-0', 'opacity-100');
            sugarDrawer.classList.add('translate-x-full', 'opacity-0', 'pointer-events-none');
            // Restaurar Main Vault
            mainVault.classList.remove('opacity-0', 'pointer-events-none');
            // Intercambio de Backgrounds de vuelta al verde original
            sugarBg.classList.remove('opacity-100');
            sugarBg.classList.add('opacity-0');
            bioBg.classList.remove('opacity-0');
        }
        if (navigator.vibrate) navigator.vibrate(15);
    }

    function seleccionarVarianteSugar(variante) {
        window.currentSugarVariant = variante;
        const config = SUGAR_CONFIG[variante];

        const titleEl = document.getElementById('sugar-variant-title');
        if (titleEl && config) {
            titleEl.textContent = config.title;
        }

        const activeClass = "cursor-pointer transition-all duration-300 px-3.5 py-1.5 bg-[#1a0c1e]/80 backdrop-blur-md rounded-sm text-white border border-pink-500/50 shadow-[0_0_12px_rgba(236,72,153,0.15)]";
        const inactiveClass = "cursor-pointer transition-all duration-300 px-3.5 py-1.5 bg-black/40 backdrop-blur-md rounded-sm text-white/40 border border-white/5 hover:border-pink-500/30 hover:text-white/80";

        ['choco', 'vanilla', 'berry', 'caramel'].forEach(opt => {
            const el = document.getElementById(`sugar-${opt}`);
            if (el) {
                el.className = (opt === variante.toLowerCase()) ? activeClass : inactiveClass;
            }
        });

        if (navigator.vibrate) navigator.vibrate(8);
    }

    function adquirirNodoSugar(producto) {
        const varianteActiva = window.currentSugarVariant || "CHOCO";
        const productoSeleccionado = SUGAR_CONFIG[varianteActiva]?.wa || `${producto} ${varianteActiva}`;
        
        const numeroCelular = "573243770474"; 
        const mensaje = `🧁 *NUEVA ORDEN - SUGARRUSH* 🧁\n\n` +
                        `• *Línea:* Dulce / Postres\n` +
                        `• *Producto:* ${productoSeleccionado}\n` +
                        `Solicito el despacho e información de esta orden de postre.`;

        const urlWhatsapp = `https://api.whatsapp.com/send?phone=${numeroCelular}&text=${encodeURIComponent(mensaje)}`;
        
        if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
        window.open(urlWhatsapp, '_blank');
    }
</script>
</body>
