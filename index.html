    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    screens: {
                        'xs': '400px',
                    },
                    colors: { 'jako-black': '#0a0705' },
                    fontFamily: { 
                        'sans': ['Orbitron', 'sans-serif'],

    <style>
        body {

        #page-bg-overlay, #sugar-bg-overlay {

        .img-glow-transition {
            transition: filter 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: filter, transform, opacity;
        }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

<script>
    const BIORUSH_DATABASE = {

            'INFUSED': { desc: 'Hidratación avanzada con extractos botánicos termogénicos activos.', label: 'HYDRUSH THERMO INFUSED', img: 'img/item2_infused.png', spec: '500 ML // HYDRATE', price: '$52.000 COP', id: 'BR-02-INF' }

            'REST': { desc: 'Inductor de sueño profundo y optimización del ciclo circadiano.', label: 'ADAPTOGENS NIGHT REST', img: 'img/item3_rest.png', spec: '30 CAPS // 500 MGRS', price: '$90.000 COP', id: 'BR-03-RST' }
        },
        'ITEM4': {
            'BURN': { desc: 'Acelerador metabólico y oxidación lipídica en entornos de ayuno.', label: 'METABOLIC LIPID BURN', img: 'img/item4_burn.png', spec: '90 TABS // 300 MGRS', price: '$95.000 COP', id: 'BR-04-BRN' },

        }
    };

    const SUGARRUSH_DATABASE = {
        'SUGARRUSH': {
            'CHOCO': { desc: 'Chocolate amargo al 70% infusionado con destellos dorados comestibles.', label: 'SUGARRUSH CHOCO GLOW', img: 'img/sugar_choco.png', spec: '250 GRS // DELI-SIZE', price: '$35.000 COP', id: 'SR-01-CHO' },
            'VANILLA': { desc: 'Crema de vainilla de Papantla texturizada con base crocante futurista.', label: 'SUGARRUSH VANILLA SKY', img: 'img/sugar_vanilla.png', spec: '250 GRS // DELI-SIZE', price: '$32.000 COP', id: 'SR-01-VAN' },
            'BERRY': { desc: 'Coulis de frutos del bosque ácidos con esferificaciones de gelatina.', label: 'SUGARRUSH SWEET BERRY', img: 'img/sugar_berry.png', spec: '230 GRS // DELI-SIZE', price: '$38.000 COP', id: 'SR-01-BER' },
            'CARAMEL': { desc: 'Toffee salado fluido con cristales de sal marina a baja temperatura.', label: 'SUGARRUSH GOLD CARAMEL', img: 'img/sugar_caramel.png', spec: '260 GRS // DELI-SIZE', price: '$36.000 COP', id: 'SR-01-CAR' }
        },
        'POSTRE2': {
            'PISTACHIO': { desc: 'Gelato cremoso de pistacho puro de Sicilia emulsionado con nitrógeno.', label: 'ICE-LAB REAL PISTACHIO', img: 'img/postre2_pistachio.png', spec: '180 ML // ICE-LAB', price: '$22.000 COP', id: 'SR-02-PST' },

    let activeBioItem = 'BIORUSH';
    let activeBioVariant = 'FOCUS';
    let activeSugarItem = 'SUGARRUSH';
    let activeSugarVariant = 'CHOCO';
    const numeroCelular = "573243770474";

    function inicializarBioRush() {
        const menuContainer = document.getElementById('biorush-items-menu');
        menuContainer.innerHTML = Object.keys(BIORUSH_DATABASE).map(item => `
            <span id="menu-bio-${item}" onclick="cambiarBioItem('${item}')" class="cursor-pointer tracking-[0.15em] transition-all duration-300 h-5 leading-none font-bold">
                ${item}
            </span>
        `).join('');
        actualizarBioUI();
    }

    function cambiarBioItem(itemKey) {
        activeBioItem = itemKey;
        activeBioVariant = Object.keys(BIORUSH_DATABASE[itemKey])[0];
        actualizarBioUI();
        if (navigator.vibrate) navigator.vibrate(12);
    }

    function seleccionarBioVariante(variantKey) {
        activeBioVariant = variantKey;
        actualizarBioUI();
        if (navigator.vibrate) navigator.vibrate(6);
    }

    function actualizarBioUI() {
        const itemData = BIORUSH_DATABASE[activeBioItem];
        const config = itemData[activeBioVariant];

        document.getElementById('drawer-vault-node').textContent = activeBioItem;

        const descEl = document.getElementById('biorush-description');
        const packImg = document.getElementById('biorush-pack-img');
        
        descEl.style.opacity = 0;
        packImg.style.opacity = 0;

        setTimeout(() => {
            descEl.textContent = config.desc;
            packImg.src = config.img;
            document.getElementById('laser-variant-title').textContent = config.label;
            document.getElementById('biorush-spec').textContent = config.spec;
            document.getElementById('biorush-price').textContent = config.price;
            
            descEl.style.opacity = 1;
            packImg.style.opacity = 1;
        }, 150);

        Object.keys(BIORUSH_DATABASE).forEach(item => {
            const el = document.getElementById(`menu-bio-${item}`);
            if (el) {
                el.className = (item === activeBioItem) 
                    ? "cursor-pointer tracking-[0.15em] transition-all duration-300 h-5 leading-none font-bold text-white scale-105 border-b border-emerald-400 pb-0.5" 
                    : "cursor-pointer tracking-[0.15em] transition-all duration-300 h-5 leading-none text-white/40 hover:text-white/80";
            }
        });

        const variantContainer = document.getElementById('biorush-variants-container');
        const activeClass = "cursor-pointer transition-all duration-300 px-2.5 py-1.5 bg-[#141414]/80 backdrop-blur-md rounded-sm text-white border border-white/40 shadow-[0_0_12px_rgba(255,255,255,0.1)] font-black scale-105";
        const inactiveClass = "cursor-pointer transition-all duration-300 px-2.5 py-1.5 bg-black/40 backdrop-blur-md rounded-sm text-white/40 border border-white/5 hover:border-white/30 hover:text-white/80";

        variantContainer.innerHTML = Object.keys(itemData).map(v => `
            <span onclick="seleccionarBioVariante('${v}')" class="${v === activeBioVariant ? activeClass : inactiveClass}">
                ${v}
            </span>
        `).join('');
    }

    function adquirirNodo() {
        const config = BIORUSH_DATABASE[activeBioItem][activeBioVariant];
        const mensaje = `⚡ *NUEVA ORDEN - BIORUSH* ⚡\n\n` +
                        `• *Nodo Base:* ${activeBioItem}\n` +
                        `• *Variante:* ${activeBioVariant}\n` +
                        `• *Especificación:* ${config.spec}\n` +
                        `• *Ref Label:* ${config.label}\n` +
                        `• *Precio:* ${config.price}\n` +
                        `• *ID Seguridad:* \`${config.id}\`\n\n` +
                        `Solicito la inicialización y el despacho inmediato de esta orden.`;

        const urlWhatsapp = `https://api.whatsapp.com/send?phone=${numeroCelular}&text=${encodeURIComponent(mensaje)}`;
        if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
        window.open(urlWhatsapp, '_blank');
    }

    function inicializarSugarRush() {
        const menuContainer = document.getElementById('sugar-items-menu');
        menuContainer.innerHTML = Object.keys(SUGARRUSH_DATABASE).map(item => `
            <span id="menu-sugar-${item}" onclick="cambiarSugarItem('${item}')" class="cursor-pointer tracking-[0.15em] transition-all duration-300 h-5 leading-none font-bold">
                ${item === 'SUGARRUSH' ? 'POSTRE1' : item}
            </span>
        `).join('');
        actualizarSugarUI();
    }

    function cambiarSugarItem(itemKey) {
        activeSugarItem = itemKey;
        activeSugarVariant = Object.keys(SUGARRUSH_DATABASE[itemKey])[0];
        actualizarSugarUI();
        if (navigator.vibrate) navigator.vibrate(12);
    }

    function seleccionarSugarVariante(variantKey) {
        activeSugarVariant = variantKey;
        actualizarSugarUI();
        if (navigator.vibrate) navigator.vibrate(6);
    }

    function actualizarSugarUI() {
        const itemData = SUGARRUSH_DATABASE[activeSugarItem];
        const config = itemData[activeSugarVariant];

        document.getElementById('drawer-sugar-node').textContent = activeSugarItem === 'SUGARRUSH' ? 'POSTRE1' : activeSugarItem;

        const descEl = document.getElementById('sugar-description');
        const packImg = document.getElementById('sugar-pack-img');
        
        descEl.style.opacity = 0;
        packImg.style.opacity = 0;

        setTimeout(() => {
            descEl.textContent = config.desc;
            packImg.src = config.img;
            document.getElementById('sugar-variant-title').textContent = config.label;
            document.getElementById('sugar-spec').textContent = config.spec;
            document.getElementById('sugar-price').textContent = config.price;
            
            descEl.style.opacity = 1;
            packImg.style.opacity = 1;
        }, 150);

        Object.keys(SUGARRUSH_DATABASE).forEach(item => {
            const el = document.getElementById(`menu-sugar-${item}`);
            if (el) {
                el.className = (item === activeSugarItem) 
                    ? "cursor-pointer tracking-[0.15em] transition-all duration-300 h-5 leading-none font-bold text-white scale-105 border-b border-pink-500 pb-0.5" 
                    : "cursor-pointer tracking-[0.15em] transition-all duration-300 h-5 leading-none text-white/30 hover:text-white/70";
            }
        });

        const variantContainer = document.getElementById('sugar-variants-container');
        const activeClass = "cursor-pointer transition-all duration-300 px-2.5 py-1.5 bg-[#1a0c1e]/80 backdrop-blur-md rounded-sm text-white border border-pink-500/50 shadow-[0_0_12px_rgba(236,72,153,0.15)] font-black scale-105";
        const inactiveClass = "cursor-pointer transition-all duration-300 px-2.5 py-1.5 bg-black/40 backdrop-blur-md rounded-sm text-white/40 border border-white/5 hover:border-pink-500/30 hover:text-white/80";

        variantContainer.innerHTML = Object.keys(itemData).map(v => `
            <span onclick="seleccionarSugarVariante('${v}')" class="${v === activeSugarVariant ? activeClass : inactiveClass}">
                ${v}
            </span>
        `).join('');
    }

    function adquirirNodoSugar() {
        const config = SUGARRUSH_DATABASE[activeSugarItem][activeSugarVariant];
        const mensaje = `🧁 *NUEVA ORDEN - SUGARRUSH* 🧁\n\n` +
                        `• *Línea:* Dulce / Postres\n` +
                        `• *Sección:* ${activeSugarItem}\n` +
                        `• *Variante Electiva:* ${activeSugarVariant}\n` +
                        `• *Volumen:* ${config.spec}\n` +
                        `• *Precio:* ${config.price}\n` +
                        `• *ID Seguridad:* \`${config.id}\`\n\n` +
                        `Solicito información de despacho para esta orden molecular.`;

        const urlWhatsapp = `https://api.whatsapp.com/send?phone=${numeroCelular}&text=${encodeURIComponent(mensaje)}`;
        if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
        window.open(urlWhatsapp, '_blank');
    }

    function toggleSugarDrawer(open) {
        const sugarDrawer = document.getElementById('sugar-drawer');
        const mainVault = document.getElementById('main-vault');
        const bioBg = document.getElementById('page-bg-overlay');
        const sugarBg = document.getElementById('sugar-bg-overlay');

        if (open) {
            sugarDrawer.classList.remove('translate-x-full', 'opacity-0', 'pointer-events-none');
            sugarDrawer.classList.add('translate-x-0', 'opacity-100');
            mainVault.classList.add('opacity-0', 'pointer-events-none');
            bioBg.classList.add('opacity-0');
            sugarBg.classList.remove('opacity-0');
            sugarBg.classList.add('opacity-100');
        } else {
            sugarDrawer.classList.remove('translate-x-0', 'opacity-100');
            sugarDrawer.classList.add('translate-x-full', 'opacity-0', 'pointer-events-none');
            mainVault.classList.remove('opacity-0', 'pointer-events-none');
            sugarBg.classList.remove('opacity-100');
            sugarBg.classList.add('opacity-0');
            bioBg.classList.remove('opacity-0');
        }
        if (navigator.vibrate) navigator.vibrate(15);
    }

    document.addEventListener('DOMContentLoaded', () => {
        inicializarBioRush();
        inicializarSugarRush();
    });
</script>
</body>
</html>
