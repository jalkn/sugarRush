<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link class="icon" type="image/png" href="img/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUGARRUSH.WORLD</title>
    
    <!-- Fuentes Web -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* Variables y Reset */
        :root[data-theme="dark"] {
            --jako-bg: rgba(190, 151, 183, 0.95); 
            --jako-text: #ffffff;
            --jako-border: rgba(255, 255, 255, 0.02);
            --jako-glass: rgba(0, 0, 0, 0.6);
            --jako-led: rgba(240, 245, 255, 0.85);
            --gradient-start: rgba(0, 140, 255, 0.025);
            --gradient-mid: rgba(10, 10, 10, 0.9);
            --gradient-end: #222222;
            
            --font-sans: 'Orbitron', sans-serif;
            --font-mono: 'Orbitron', monospace;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            overscroll-behavior: none;
            background-color: var(--jako-bg);
            color: var(--jako-text);
            font-family: var(--font-body);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            transition: color 0.5s ease;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background-color: var(--jako-text);
            color: var(--jako-bg);
        }

        /* Estructura Principal */
        #page-bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            width: 100%;
            background: radial-gradient(circle at 50% 50%, var(--gradient-start) 35%, var(--gradient-mid) 85%, var(--gradient-end) 95%);
        }

        /* Glassmorphism Headers & Footers */
        .glass-header { 
            width: 100%;
            flex-shrink: 0;
            z-index: 50;
            padding: 1.25rem 2.25rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12); 
            box-shadow: inset 0 -1px 0px rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px) saturate(120%); 
            -webkit-backdrop-filter: blur(40px) saturate(120%);
        }

        .glass-footer { 
            width: 100%;
            flex-shrink: 0;
            z-index: 50;
            padding: 1.25rem 2.25rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.12); 
            box-shadow: inset 0 1px 0px rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px) saturate(120%); 
            -webkit-backdrop-filter: blur(40px) saturate(120%);
        }

        .nav-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
        }

        @media (min-width: 640px) {
            .nav-container { max-width: 675px; }
        }

        /* Botones de Navegación */
        .nav-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0.75rem;
            font-size: 13.5px;
            font-family: var(--font-mono);
            line-height: 1;
            user-select: none;
            opacity: 0.5;
            transition: opacity 0.3s ease;
            color: #ffffff;
            flex-shrink: 0;
        }

        .nav-btn:hover { opacity: 1; }

        /* Componentes Tipográficos */
        .brand-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            width: 100%;
            max-width: 270px;
        }

        .brand-title {
            color: var(--jako-led);
            font-size: 14px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-family: var(--font-sans);
            text-align: center;
        }

        @media (min-width: 768px) {
            .brand-title { font-size: 17px; }
        }

        .category-indicator {
            font-size: 7.5px;
            font-family: var(--font-mono);
            letter-spacing: 0.25em;
            opacity: 0.4;
            text-transform: uppercase;
        }

        /* Áreas de Contenido Central */
        #main-vault {
            position: relative;
            z-index: 10;
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0 1.5rem;
            gap: 1.5rem;
        }

        #artepanel-pack-container {
            position: relative;
            width: 50vw;
            height: 50vw;
            max-width: 300px;
            max-height: 300px;
            min-width: 225px;
            min-height: 225px;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
            border-radius: 50%;
            overflow: hidden;
            clip-path: circle(50%);
            filter: drop-shadow(0 25px 60px rgba(0,0,0,0.95));
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        #artepanel-pack-container:hover { transform: scale(1.03); }

        @media (min-width: 768px) {
            #artepanel-pack-container {
                width: 30vh;
                height: 30vh;
            }
        }

        #artepanel-mask-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            clip-path: circle(50%);
            background-size: cover;
            background-position: center;
            transition: background-image 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s ease-out;
        }

        .img-overlay {
            position: absolute;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.1);
            mix-blend-mode: overlay;
        }

        /* Ficha Técnica */
        .meta-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 380px;
            gap: 0.5rem;
            padding: 0 1rem;
            z-index: 20;
        }

        .meta-desc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 0.025em;
            line-height: 1.6;
            min-height: 34px;
        }

        @media (min-width: 768px) {
            .meta-desc { font-size: 12px; }
        }

        .meta-specs {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        .price-text {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: normal;
        }

        /* SVG Footer */
        .variant-display {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }

        .laser-svg {
            width: 100%;
            max-width: 270px;
            height: 1.5rem;
            fill: none;
        }

        .laser-text {
            fill: var(--jako-led);
            font-family: var(--font-mono);
            font-size: 8.5px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            transition: all 0.5s ease;
        }

        @media (min-width: 768px) {
            .laser-text { font-size: 10px; }
        }
    </style>
</head>
<body>

    <div id="page-bg-overlay">

        <!-- Header -->
        <header class="glass-header">
            <div class="nav-container">
                <button onclick="navegarCategoria(-1)" class="nav-btn">◀</button>
                <div class="brand-wrapper"> 
                    <span class="brand-title">SUGARRUSH</span>
                    <span id="sugar-category-indicator" class="category-indicator">ALFAJORES</span>
                </div>
                <button onclick="navegarCategoria(1)" class="nav-btn">▶</button>
            </div>
        </header>

        <!-- Main -->
        <main id="main-vault">
            <div id="artepanel-pack-container" onclick="adquirirNodoSugar()">
                <div id="artepanel-mask-wrapper" style="background-image: url('img/alfajores_x5.jpg');">
                    <div class="img-overlay"></div>
                </div>
            </div>

            <div class="meta-container">
                <p id="sugar-variant-desc" class="meta-desc">
                    Cargando especificaciones...
                </p>
                <div class="meta-specs">
                    <span id="sugar-variant-spec">-</span>
                    <span>|</span>
                    <span id="sugar-variant-price" class="price-text">-</span>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="glass-footer">
            <div class="nav-container">
                <button onclick="navigateVariant(-1)" class="nav-btn">◀</button>
                
                <div class="variant-display">
                    <svg class="laser-svg" viewBox="0 0 200 16">
                        <text id="laser-variant-title-footer" x="50%" y="13" text-anchor="middle" class="laser-text">
                            ALFAJOR X5
                        </text>
                    </svg>
                </div>
                
                <button onclick="navigateVariant(1)" class="nav-btn">▶</button>
            </div>
        </footer>

    </div>

    <script>
        const SUGARRUSH_CATALOG = {
            'ALFAJORES': {
                defaultVariant: 'ALFAJOR X5',
                variants: {
                    'ALFAJOR X5': {
                        desc: 'Clásicos y suaves, perfectos para un antojo personal.',
                        label: 'SUGARRUSH ALFAJORES X5',
                        img: 'img/alfajores_x5.jpg',
                        spec: '5 UNIDADES // PACK CLÁSICO',
                        price: '$16.000',
                        id: 'SR-ALF-X5'
                    },
                    'ALFAJOR X6': {
                        desc: 'Caja premium variada: Maní x2, Coco x2, Leche en Polvo x2.',
                        label: 'ALFAJORES VARIADOS X6',
                        img: 'img/alfajores_x6.png',
                        spec: '6 UNIDADES // RECOMENDADO',
                        price: '$20.000',
                        id: 'SR-ALF-X6' 
                    },
                    'ALFAJOR X50': {
                        desc: 'La dosis ideal de dulzura para tus banquetes y eventos masivos.',
                        label: 'ALFAJORES PARTY PACK X50',
                        img: 'img/alfajores_x50.png',
                        spec: '50 UNIDADES // BULK TRADICIONAL',
                        price: '$100.000',
                        id: 'SR-ALF-X50' 
                    }
                }
            },
            'POSTRES': {
                defaultVariant: 'MARIA LUISA',
                variants: {
                    'MARIA LUISA': {
                        desc: 'Tradicional bizcochuelo esponjoso balanceado con capas de mora y arequipe.',
                        label: 'TORTA MARÍA LUISA',
                        img: 'img/torta_marialuisa.png',
                        spec: 'TORTA ENTERA // ARTESANAL',
                        price: '$45.000', 
                        id: 'SR-POST-ML'
                    }
                }
            },
            'BROWNIES': {
                defaultVariant: 'BROWNIE X50',
                variants: {
                    'BROWNIE X50': { 
                        desc: 'Melcochudos y con el toque justo de cacao gourmet puro. ¡Ideal para compartir!', 
                        label: 'PACK BROWNIES X50', 
                        img: 'img/brownies_x50.png', 
                        spec: '50 UNIDADES // METROPOLITAN PACK', 
                        price: '$100.000', 
                        id: 'SR-BRW-X50' 
                    }
                }
            },
            'FIAMBRES': {
                defaultVariant: 'LASAÑA POLLO',
                variants: {
                    'LASAÑA POLLO': { 
                        desc: 'Pollo desmechado, queso fundido, salsa bechamel de la casa y pasta artesanal. (14 x 11.5 cm)', 
                        label: 'LASAÑA DE POLLO ARTESANAL', 
                        img: 'img/lasagna_pollo.png', 
                        spec: 'DIMENSIONES 14x11.5 CM', 
                        price: '$20.000', 
                        id: 'SR-FIAM-LPO' 
                    }
                }
            }
        };

        let currentCategory = 'ALFAJORES';
        let currentVariant = 'ALFAJOR X5';
        const numeroCelular = "573243770474";

        const $ = id => document.getElementById(id);

        function navegarCategoria(direction) {
            const categories = Object.keys(SUGARRUSH_CATALOG);
            let index = categories.indexOf(currentCategory);
            index = (index + direction + categories.length) % categories.length;
            
            currentCategory = categories[index];
            currentVariant = SUGARRUSH_CATALOG[currentCategory].defaultVariant;
            
            actualizarInterfaz();
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function navigateVariant(direction) {
            const variants = Object.keys(SUGARRUSH_CATALOG[currentCategory].variants);
            let index = variants.indexOf(currentVariant);
            index = (index + direction + variants.length) % variants.length;
            
            currentVariant = variants[index];
            
            actualizarInterfaz();
            if (navigator.vibrate) navigator.vibrate(8);
        }

        function actualizarInterfaz() {
            const dataCategoria = SUGARRUSH_CATALOG[currentCategory];
            const dataVariante = dataCategoria.variants[currentVariant];

            if ($('sugar-category-indicator')) {
                $('sugar-category-indicator').textContent = currentCategory;
            }

            const wrapper = $('artepanel-mask-wrapper');
            if (wrapper) {
                wrapper.style.transform = "scale(0.95)";
                setTimeout(() => {
                    wrapper.style.backgroundImage = `url('${dataVariante.img}')`;
                    wrapper.style.transform = "scale(1)";
                }, 150);
            }

            if ($('sugar-variant-desc')) $('sugar-variant-desc').textContent = dataVariante.desc;
            if ($('sugar-variant-spec')) $('sugar-variant-spec').textContent = dataVariante.spec;
            if ($('sugar-variant-price')) $('sugar-variant-price').textContent = dataVariante.price;

            const labelTitleFooter = $('laser-variant-title-footer');
            if (labelTitleFooter) {
                labelTitleFooter.textContent = currentVariant;
            }
        }

        function adquirirNodoSugar() {
            const configActual = SUGARRUSH_CATALOG[currentCategory].variants[currentVariant];
            const mensaje = `🧁 *NUEVA ORDEN - SUGARRUSH.WORLD* 🧁\n\n` +
                            `• *Categoría:* ${currentCategory}\n` +
                            `• *Producto:* ${configActual.label}\n` +
                            `• *Presentación:* ${configActual.spec}\n` +
                            `• *Precio:* ${configActual.price}\n` +
                            `• *Token:* \`${configActual.id}\`\n\n` +
                            `Solicito verificar disponibilidad para el despacho de esta orden.`;

            const urlWhatsapp = `https://api.whatsapp.com/send?phone=${numeroCelular}&text=${encodeURIComponent(mensaje)}`;
            if (navigator.vibrate) navigator.vibrate([10, 25, 10]);
            window.open(urlWhatsapp, '_blank');
        }

        document.addEventListener('DOMContentLoaded', () => {
            actualizarInterfaz();
        });
    </script>
</body>
</html>
